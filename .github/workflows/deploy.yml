name: Deploy to Lighthouse HK

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            PROJ=/root/finance-hot-monitor_20260603120453
            cd $PROJ

            echo '=== Pull latest code ==='
            git pull origin main

            echo '=== Build backend ==='
            cd $PROJ/server
            npm ci --production=false
            npx prisma generate
            npx tsc

            echo '=== Sync database schema ==='
            npx prisma db push

            echo '=== Migrate keyword data ==='
            npx tsx scripts/migrate-keywords.ts

            echo '=== Build frontend ==='
            cd $PROJ/client
            npm ci
            npm run build

            echo '=== Restart ==='
            pm2 restart finance-monitor
            sleep 3

            echo '=== Health check ==='
            curl -s http://localhost:3001/api/health
            echo ''
            echo '✅ Deploy done'
