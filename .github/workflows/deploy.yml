name: Deploy to Lighthouse HK

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            PROJ=/root/finance-hot-monitor_20260603120453
            cd $PROJ

            echo '=== Pull latest code ==='
            git checkout main
            git pull origin main

            echo '=== Install deps ==='
            cd server
            npm ci
            npx prisma generate
            npx tsc

            echo '=== Rebuild frontend ==='
            cd $PROJ/client
            npm ci
            npm run build

            echo '=== Update static files ==='
            rm -rf /var/www/finance-monitor-frontend/*
            cp -r $PROJ/client/dist/* /var/www/finance-monitor-frontend/
            chmod -R 755 /var/www/finance-monitor-frontend

            echo '=== Restart backend ==='
            pm2 restart finance-monitor

            echo '=== Health check ==='
            sleep 3
            curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health
            echo ''
            echo '✅ Deploy complete'
