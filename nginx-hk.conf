# ============================================================
# 金融热点监控 — Nginx 反向代理（Lighthouse 香港节点）
#
# 部署：
#   sudo cp nginx-hk.conf /etc/nginx/sites-available/finance-monitor
#   sudo ln -s /etc/nginx/sites-available/finance-monitor /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo nginx -s reload
#
# SSL（域名可用后执行）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
# ============================================================

upstream finance_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;

    # 日志
    access_log /var/log/nginx/finance-monitor-access.log;
    error_log  /var/log/nginx/finance-monitor-error.log;
    client_max_body_size 10m;

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass http://finance_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # ---- WebSocket ----
    location /socket.io/ {
        proxy_pass http://finance_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ---- 安全头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
